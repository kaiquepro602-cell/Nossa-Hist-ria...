<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma história para nós ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         FUNDO ANIMADO
    ========================== -->
    <div class="background" aria-hidden="true">
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
    </div>


    <!-- =========================
         JOGO / TELA INICIAL
    ========================== -->
    <main class="game-container">

        <div class="game-card">

            <!-- Coração -->
            <div class="heart" aria-hidden="true">
                ❤️
            </div>

            <!-- Pequeno título -->
            <p class="small-title">
                UMA PEQUENA AVENTURA
            </p>

            <!-- Título principal -->
            <h1>
                Tenho uma<br>
                história para te contar...
            </h1>

            <!-- Descrição -->
            <p class="description">
                Mas para descobrir como ela termina,
                você vai precisar embarcar nessa aventura comigo.
            </p>

            <!-- Botão -->
            <button class="start-button" type="button">
                COMEÇAR A HISTÓRIA
                <span>→</span>
            </button>

            <!-- Dica -->
            <p class="hint">
                Preparada? ❤️
            </p>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
